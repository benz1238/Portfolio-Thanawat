name: Patch feature hover clipping
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-feature-hover.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works carousel hover
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('works.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('padding:14px 0 24px;scrollbar-width:thin', 'padding:28px 0 28px;scrollbar-width:thin')
          s = s.replace('.feature-card:hover,.work-item:hover{border-color:var(--acid);transform:translateY(-3px)}', '.feature-card:hover{border-color:var(--acid);transform:none}.work-item:hover{border-color:var(--acid);transform:translateY(-3px)}')
          s = s.replace('.feature-card:hover img,.work-item:hover img{filter:grayscale(0);transform:scale(1.018)}', '.feature-card:hover img,.work-item:hover img{filter:grayscale(0);transform:scale(1.018)}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/patch-feature-hover.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add works.html .github/workflows/patch-feature-hover.yml
          git commit -m "Prevent feature carousel hover clipping" || exit 0
          git push
