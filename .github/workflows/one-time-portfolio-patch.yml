name: One-time portfolio patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-portfolio-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile fade and hover zoom
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Reduce image hover zoom across pages by about 50%.
          zoom_replacements = {
              'scale(1.06)': 'scale(1.03)',
              'scale(1.04)': 'scale(1.02)',
              'scale(1.035)': 'scale(1.018)',
              'scale(1.03)': 'scale(1.015)',
              'scale(1.025)': 'scale(1.013)',
              'translateY(-10px)': 'translateY(-6px)',
          }
          for file in ['index.html', 'works.html']:
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              for old, new in zoom_replacements.items():
                  s = s.replace(old, new)
              write(file, s)

          # About page: move the fade to the front of the portrait, light and low.
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          for old, new in zoom_replacements.items():
              s = s.replace(old, new)
          s = s.replace(';box-shadow:inset 0 -150px 110px rgba(0,0,0,.58)', '')
          if '.profile-card .portrait-fade' not in s:
              s = s.replace(
                  '.profile-card:before{content:"";position:absolute;left:8%;top:10%;width:74%;height:74%;border-radius:50%;border:1px solid rgba(223,255,0,.18);animation:spin 28s linear infinite;z-index:0}',
                  '.profile-card:before{content:"";position:absolute;left:8%;top:10%;width:74%;height:74%;border-radius:50%;border:1px solid rgba(223,255,0,.18);animation:spin 28s linear infinite;z-index:0}.profile-card .portrait-fade{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:3;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.18) 42%,rgba(0,0,0,.36));mix-blend-mode:multiply}'
              )
          if '<div class="portrait-fade"></div>' not in s:
              s = s.replace(
                  '<img src="assets/Profile-Thanawat.png?v=2" alt="Thanawat profile portrait">',
                  '<img src="assets/Profile-Thanawat.png?v=2" alt="Thanawat profile portrait"><div class="portrait-fade"></div>'
              )
          write('about.html', s)
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-portfolio-patch.yml
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@github.com"
          git add index.html works.html about.html .github/workflows/one-time-portfolio-patch.yml
          git commit -m "Adjust portrait fade and reduce hover zoom" || exit 0
          git push
