name: Patch CTA button match panel
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-cta-button-match-panel.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make CTA button width match dropdown panel on every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['index.html','works.html','about.html','shokubutsu.html']
          for f in files:
              p = Path(f)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('min-width:300px;background:#0a0a0a;color:#fff;border:0;border-radius:999px;padding:17px 28px', 'width:300px;min-width:300px;background:#0a0a0a;color:#fff;border:0;border-radius:999px;padding:17px 28px')
              s = s.replace('width:300px;min-width:300px;width:300px;', 'width:300px;min-width:300px;')
              s = s.replace('min-width:0;display:inline-flex;margin-top:22px;max-width:100%;padding:17px 24px;white-space:normal;text-align:center', 'width:calc(100% - 56px);min-width:0;display:inline-flex;justify-content:center;margin-top:22px;max-width:300px;padding:17px 24px;white-space:normal;text-align:center')
              s = s.replace('min-width:0;display:inline-flex;margin-top:22px;white-space:normal', 'width:calc(100% - 56px);min-width:0;display:inline-flex;justify-content:center;margin-top:22px;max-width:300px;padding:17px 24px;white-space:normal;text-align:center')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/patch-cta-button-match-panel.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add index.html works.html about.html shokubutsu.html .github/workflows/patch-cta-button-match-panel.yml
          git commit -m "Match CTA button width to contact panel" || exit 0
          git push
