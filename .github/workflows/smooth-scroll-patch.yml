name: Smooth scroll patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smooth-scroll-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit works scroll timing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('works.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('smoothScrollTo(Math.max(0,y),920);', 'smoothScrollTo(Math.max(0,y),1280);')
          text = text.replace('const ease=t=>1-Math.pow(1-t,4);', 'const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;')
          text = text.replace('window.pageYOffset-nav-34', 'window.pageYOffset-nav-42')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/smooth-scroll-patch.yml
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add works.html .github/workflows/smooth-scroll-patch.yml
          git commit -m "Make works filter scroll smoother" || exit 0
          git push
