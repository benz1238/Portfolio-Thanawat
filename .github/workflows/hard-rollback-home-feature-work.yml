name: Hard rollback Home feature work
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hard-rollback-home-feature-work.yml
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Home before motion experiment
        run: |
          git checkout 95cf1cdceb6c1c3d45edec6590012c47d0172e3d^ -- index.html
          rm -f .github/workflows/hard-rollback-home-feature-work.yml
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add index.html .github/workflows/hard-rollback-home-feature-work.yml
          git commit -m "Hard rollback Home selected works layout" || exit 0
          git push
