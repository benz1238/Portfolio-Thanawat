name: UI system pass
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-system-pass.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          perl -0pi -e 's/top:92px;display:grid/top:83px;display:grid/g' works.html about.html
          perl -0pi -e 's/cursor:pointer\}/cursor:pointer;transition:.25s ease}/g' works.html about.html
          perl -0pi -e 's/\.contact-trigger\{min-width:0;display:inline-flex;margin-top:22px;white-space:normal\}/.contact-trigger{min-width:0;display:inline-flex;margin-top:22px;max-width:100%;padding:17px 24px;white-space:normal;text-align:center}/g' works.html about.html
          perl -0pi -e 's/\.contact-options\{left:28px;right:auto;top:calc\(100% - 18px\);width:calc\(100% - 56px\)\}/.contact-options{left:28px;right:auto;top:calc(100% - 18px);width:calc(100% - 56px);padding:10px;border-radius:24px}/g' works.html about.html
          perl -0pi -e 's/\.social\{display:flex;gap:24px\}/.social{display:flex;gap:14px/g' works.html about.html
          rm -f .github/workflows/ui-system-pass.yml
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add works.html about.html .github/workflows/ui-system-pass.yml
          git commit -m "Normalize Works and About UI system" || exit 0
          git push
