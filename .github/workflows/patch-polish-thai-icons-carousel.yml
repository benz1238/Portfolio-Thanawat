name: Patch polish Thai icons carousel
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-polish-thai-icons-carousel.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('works.html'), Path('about.html')]

          icon_svg = '''<div class="social"><a class="social-icon" href="https://www.instagram.com/benz_thw?igsh=eDRzM20ydGN3bnBp&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="16.7" cy="7.3" r="1"/></svg></a><a class="social-icon" href="https://www.linkedin.com/in/thanawat-singkilwit-54888a148" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h4v11H5zM7 4.5a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4zM11 9h3.8v1.6c.7-1.1 1.8-1.9 3.6-1.9 2.7 0 4.6 1.8 4.6 5.5V20h-4v-5.2c0-1.6-.7-2.5-1.9-2.5-1.3 0-2.1.9-2.1 2.7v5h-4z"/></svg></a><a class="social-icon" href="https://line.me/ti/p/RiZBlYuw4H" target="_blank" rel="noopener noreferrer" aria-label="Line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C6.9 4 3 7.1 3 11.1c0 3.2 2.5 5.9 5.9 6.8.2.1.5.2.5.5v1.8c0 .5.5.8.9.5l3.1-2.1c.3-.2.6-.3 1-.3 3.8-.7 6.6-3.6 6.6-7.1C21 7.1 17.1 4 12 4zM8 13.4H5.8V8.9h1.1v3.5H8v1zm2 0H8.9V8.9H10v4.5zm4.6 0h-1.1l-1.9-2.5v2.5h-1.1V8.9h1.1l1.9 2.6V8.9h1.1v4.5zm3.6-3.5h-1.9v.7H18v1h-1.7v.8h1.9v1h-3V8.9h3v1z"/></svg></a><a class="social-icon" href="mailto:Thanawat.skw@gmail.com" aria-label="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></a></div>'''

          icon_css = ".social-icon{width:38px;height:38px;border:1px solid rgba(198,201,171,.28);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:rgba(10,10,10,.36);transition:.25s ease}.social-icon:hover{color:#0a0a0a;background:var(--acid);border-color:var(--acid);transform:translateY(-3px)}.social-icon svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.social-icon:nth-child(2) svg,.social-icon:nth-child(3) svg{fill:currentColor;stroke:none}"

          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace("family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap", "family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Prompt:wght@400;500;700;800&display=swap")
              s = s.replace("--body:'Inter',sans-serif}", "--body:'Inter',sans-serif;--thai:'Prompt',sans-serif}")
              if '.social-icon{' not in s:
                  s = s.replace('.social{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}', '.social{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}' + icon_css)
              s = re.sub(r'<div class="social"><a href="https://www\.instagram\.com/benz_thw\?igsh=eDRzM20ydGN3bnBp&utm_source=qr" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://www\.linkedin\.com/in/thanawat-singkilwit-54888a148" target="_blank" rel="noopener noreferrer">LinkedIn</a><a href="https://line\.me/ti/p/RiZBlYuw4H" target="_blank" rel="noopener noreferrer">Line</a><a href="mailto:Thanawat\.skw@gmail\.com">Email</a></div>', icon_svg, s)
              s = re.sub(r'\.social a\{[^}]*\}', '', s)
              s = re.sub(r'\.social a:before\{[^}]*\}', '', s)
              s = re.sub(r'\.social a\[href\*="instagram"\]:before\{[^}]*\}', '', s)
              s = re.sub(r'\.social a\[href\*="linkedin"\]:before\{[^}]*\}', '', s)
              s = re.sub(r'\.social a\[href\*="line"\]:before\{[^}]*\}', '', s)
              s = re.sub(r'\.social a\[href\^="mailto"\]:before\{[^}]*\}', '', s)
              p.write_text(s, encoding='utf-8')

          # Works carousel: add safe top room and avoid hover clipping.
          p = Path('works.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('padding:0 0 20px;scrollbar-width:thin', 'padding:14px 0 24px;scrollbar-width:thin')
          s = s.replace('.feature-card:hover,.work-item:hover{border-color:var(--acid);transform:translateY(-6px)}', '.feature-card:hover,.work-item:hover{border-color:var(--acid);transform:translateY(-3px)}')
          p.write_text(s, encoding='utf-8')

          # About page: Thai highlight + Prompt font + profile fade layer front setup.
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          thai_css = ".thai-mark{position:relative;display:inline;padding:.02em .18em .08em;font-family:var(--thai);font-weight:700;color:#0a0a0a;background:linear-gradient(90deg,rgba(223,255,0,.95),rgba(223,255,0,.58));box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:.12em;animation:markSwipe 2.8s ease-in-out infinite alternate}.thai-mark:after{content:'';position:absolute;left:0;right:0;bottom:.02em;height:2px;background:#0a0a0a;opacity:.28}@keyframes markSwipe{0%{filter:brightness(.9);box-shadow:0 0 0 rgba(223,255,0,0)}100%{filter:brightness(1.06);box-shadow:0 0 28px rgba(223,255,0,.2)}}"
          if '.thai-mark{' not in s:
              s = s.replace('.story-card p{max-width:880px;margin:24px 0 0;color:rgba(229,226,225,.74);font-size:17px;line-height:1.75}', '.story-card p{max-width:880px;margin:24px 0 0;color:rgba(229,226,225,.74);font-size:17px;line-height:1.75}' + thai_css)
          s = s.replace('“เดี๋ยวลองทำให้มันมีอะไรอีกนิด”', '“<span class="thai-mark" lang="th">เดี๋ยวลองทำให้มันมีอะไรอีกนิด</span>”')
          s = s.replace('z-index:3;text-shadow:0 0 24px rgba(0,0,0,.9),0 0 60px rgba(0,0,0,.95)', 'z-index:6;text-shadow:0 0 24px rgba(0,0,0,.9),0 0 60px rgba(0,0,0,.95)')
          s = s.replace('height:34%;z-index:3;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.18) 42%,rgba(0,0,0,.36));mix-blend-mode:multiply', 'height:38%;z-index:5;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.34) 0%,rgba(0,0,0,.22) 42%,rgba(0,0,0,0) 100%);mix-blend-mode:multiply')
          s = s.replace('z-index:4;background:var(--acid)', 'z-index:7;background:var(--acid)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/patch-polish-thai-icons-carousel.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add index.html works.html about.html .github/workflows/patch-polish-thai-icons-carousel.yml
          git commit -m "Polish carousel Thai highlight and social icons" || exit 0
          git push
