name: Restore home selected exact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-home-selected-exact.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore locked Selected Works markup and safe click
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<a class="card shoku overlay no-save" href="shokubutsu.html" aria-label="Open Shokubutsu project detail"><span class="tag">TVC KV Campaign</span><div class="frame"><img src="assets/shokubutsu.png" alt="Shokubutsu Campaign" draggable="false"></div><div class="content"><h3 class="work-title">Shokubutsu</h3><p class="work-meta">TVC, KEY VISUAL, AND BODY-CARE CAMPAIGN ROLLOUT.</p></div></a>','<article class="card shoku overlay no-save" role="link" tabindex="0" onclick="location.href=\'shokubutsu.html\'" onkeydown="if(event.key===\'Enter\'){location.href=\'shokubutsu.html\'}"><span class="tag">TVC KV Campaign</span><div class="frame"><img src="assets/shokubutsu.png" alt="Shokubutsu Campaign" draggable="false"></div><div class="content"><h3 class="work-title">Shokubutsu</h3><p class="work-meta">TVC, KEY VISUAL, AND BODY-CARE CAMPAIGN ROLLOUT.</p></div></article>')
          p.write_text(s, encoding='utf-8')

          p=Path('assets/site-motion.css')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.selected-card-in{opacity:0;filter:blur(7px);transform:translate3d(0,22px,0) scale(.988);transition:opacity .82s cubic-bezier(.16,1,.3,1),filter .82s cubic-bezier(.16,1,.3,1),transform .82s cubic-bezier(.16,1,.3,1);transition-delay:var(--selected-delay,0ms)}.selected-card-in.is-visible{opacity:1;filter:blur(0);transform:none}', '.selected-card-in{opacity:0;filter:blur(7px);transform:translate3d(0,14px,0);transition:opacity .78s cubic-bezier(.16,1,.3,1),filter .78s cubic-bezier(.16,1,.3,1),transform .78s cubic-bezier(.16,1,.3,1);transition-delay:var(--selected-delay,0ms)}.selected-card-in.is-visible{opacity:1;filter:blur(0);transform:none}.motion-ready .wall .card{translate:0 0!important}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/restore-home-selected-exact.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add index.html assets/site-motion.css .github/workflows/restore-home-selected-exact.yml
          git commit -m "Restore locked home selected works layout" || exit 0
          git push
