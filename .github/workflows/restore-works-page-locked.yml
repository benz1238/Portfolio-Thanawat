name: Restore Works page locked layout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-works-page-locked.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore locked Works page and reapply only safe fixes
        run: |
          git checkout 0aafaaf -- works.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')

          # Keep Shokubutsu detail accessible without changing the locked layout structure.
          s=s.replace('<article class="feature-card"><img src="assets/shokubutsu.png" alt="Shokubutsu">', '<article class="feature-card" role="link" tabindex="0" onclick="location.href=\'shokubutsu.html\'" onkeydown="if(event.key===\'Enter\'){location.href=\'shokubutsu.html\'}"><img src="assets/shokubutsu.png" alt="Shokubutsu">')
          s=s.replace('<article class="work-item" data-category="kv"><div class="thumb"><img src="assets/shokubutsu.png" alt="Shokubutsu">', '<article class="work-item" data-category="kv" role="link" tabindex="0" onclick="location.href=\'shokubutsu.html\'" onkeydown="if(event.key===\'Enter\'){location.href=\'shokubutsu.html\'}"><div class="thumb"><img src="assets/shokubutsu.png" alt="Shokubutsu">')

          # Keep current footer copyright line break, no layout impact.
          s=s.replace('© 2026 Thanawat Singkilwit. All rights reserved.', '© 2026 Thanawat Singkilwit.<span>All rights reserved.</span>')
          s=s.replace('.copy{font:500 10px/1.4 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:right}', '.copy{font:500 10px/1.4 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:right}.copy span{display:block;margin-top:6px}')

          # Add a very small staggered entrance only, no final-position change.
          s=s.replace('.feature-card,.work-item{position:relative;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#171717;transition:.35s cubic-bezier(.18,.9,.22,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}', '.feature-card,.work-item{position:relative;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#171717;transition:.35s cubic-bezier(.18,.9,.22,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}.feature-card,.work-item{cursor:pointer}.feature-card{opacity:0;transform:translateY(18px);filter:blur(6px)}.feature-grid.is-visible .feature-card{opacity:1;transform:none;filter:none}.feature-grid.is-visible .feature-card:nth-child(1){transition-delay:.05s}.feature-grid.is-visible .feature-card:nth-child(2){transition-delay:.13s}.feature-grid.is-visible .feature-card:nth-child(3){transition-delay:.21s}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/restore-works-page-locked.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add works.html .github/workflows/restore-works-page-locked.yml
          git commit -m "Restore locked Selected Works page layout" || exit 0
          git push
