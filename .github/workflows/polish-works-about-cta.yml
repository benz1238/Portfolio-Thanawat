name: Polish works about cta
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-works-about-cta.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Works: feature cards full color from first render + snappier filter feel
          works_css = Path('assets/css/works.css')
          s = works_css.read_text(encoding='utf-8')
          add = """

/* polish: works feature cards should be vivid immediately */
.feature-card img{filter:none!important;transform:scale(1.01)}
.feature-card:hover img{filter:none!important;transform:scale(1.018)}
.filter-btn{transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s cubic-bezier(.16,1,.3,1)}
.archive{transition:opacity .22s ease,transform .22s cubic-bezier(.16,1,.3,1)}
.work-item{transition:opacity .22s ease,transform .22s cubic-bezier(.16,1,.3,1),border-color .22s ease,box-shadow .22s ease}
.cta{--contact-w:300px}.contact-trigger,.contact-options{width:var(--contact-w)!important;max-width:var(--contact-w)!important}
@media(max-width:767px){.cta{--contact-w:min(300px,calc(100% - 56px))}.contact-trigger{width:var(--contact-w)!important;max-width:var(--contact-w)!important}.contact-options{width:var(--contact-w)!important;max-width:var(--contact-w)!important}}
"""
          if 'works feature cards should be vivid immediately' not in s:
              works_css.write_text(s + add, encoding='utf-8')

          # 2) About: profile image bottom locked, no fade/name, capsule uses name
          about_css = Path('assets/css/about.css')
          s = about_css.read_text(encoding='utf-8')
          add = """

/* polish: profile card portrait sits on bottom, cleaner label */
.profile-card{display:flex;align-items:flex-end;justify-content:center;padding-top:82px}
.profile-card:after,.profile-card .portrait-fade{display:none!important}
.profile-card img{top:auto!important;bottom:0!important;left:50%!important;width:min(82%,460px)!important;transform:translateX(-50%)!important;animation:floatPortraitClean 5.5s ease-in-out .8s infinite!important}
.profile-note{top:30px;left:30px}
@keyframes floatPortraitClean{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
.cta{--contact-w:300px}.contact-trigger,.contact-options{width:var(--contact-w)!important;max-width:var(--contact-w)!important}
@media(max-width:767px){.profile-card{min-height:520px;padding-top:92px}.profile-card img{width:min(88%,420px)!important}.cta{--contact-w:min(300px,calc(100% - 56px))}.contact-trigger{width:var(--contact-w)!important;max-width:var(--contact-w)!important}.contact-options{width:var(--contact-w)!important;max-width:var(--contact-w)!important}}
"""
          if 'profile card portrait sits on bottom' not in s:
              about_css.write_text(s + add, encoding='utf-8')

          about_html = Path('about.html')
          s = about_html.read_text(encoding='utf-8')
          s = s.replace('<div class="profile-note">Profile Cutout</div>', '<div class="profile-note">THANAWAT S.</div>')
          s = s.replace('<div class="portrait-fade"></div>', '')
          about_html.write_text(s, encoding='utf-8')

          # 3) CTA panel width same as trigger across other pages too
          for css_name in ['assets/css/home.css','assets/css/shokubutsu.css']:
              p = Path(css_name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              add = """

/* polish: contact panel follows CTA button width */
.cta{--contact-w:300px}.contact-trigger,.contact-options{width:var(--contact-w)!important;max-width:var(--contact-w)!important}
@media(max-width:767px){.cta{--contact-w:min(300px,calc(100% - 56px))}.contact-trigger{width:var(--contact-w)!important;max-width:var(--contact-w)!important}.contact-options{width:var(--contact-w)!important;max-width:var(--contact-w)!important}}
"""
              if 'contact panel follows CTA button width' not in s:
                  p.write_text(s + add, encoding='utf-8')

          # 4) Works filter: reduce sluggish scroll delay/duration
          works_html = Path('works.html')
          s = works_html.read_text(encoding='utf-8')
          s = s.replace('smoothScrollTo(Math.max(0,y),1280);', 'smoothScrollTo(Math.max(0,y),720);')
          s = s.replace('}},190);', '}},80);')
          works_html.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/polish-works-about-cta.yml
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add assets/css works.html about.html .github/workflows/polish-works-about-cta.yml
          git commit -m "Polish Works cards About portrait and CTA panel sizing" || exit 0
          git push
