name: Patch filter smooth offset
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-filter-smooth-offset.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch smoother filter scroll offset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('works.html')
          s = p.read_text(encoding='utf-8')
          old = "const target=f==='all'?document.querySelector('#featured-head'):document.querySelector('#archive-title');setTimeout(()=>{target?.scrollIntoView({behavior:'smooth',block:'start'});},80);"
          new = "const target=f==='all'?document.querySelector('#featured-head'):document.querySelector('#archive-title');setTimeout(()=>{if(target){const nav=document.querySelector('.nav')?.offsetHeight||86;const y=target.getBoundingClientRect().top+window.pageYOffset-nav-26;window.scrollTo({top:Math.max(0,y),behavior:'smooth'});}},160);"
          if old not in s:
              raise SystemExit('scroll snippet not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/patch-filter-smooth-offset.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add works.html .github/workflows/patch-filter-smooth-offset.yml
          git commit -m "Smooth scroll to filtered works with offset" || exit 0
          git push
