name: Patch selected motion and links
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-selected-motion-and-links.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selected work parallax and Shokubutsu links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Home: make Shokubutsu selected-work card open the detail page, without changing layout.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<article class="card shoku overlay no-save"><span class="tag">TVC KV Campaign</span><div class="frame"><img src="assets/shokubutsu.png" alt="Shokubutsu Campaign" draggable="false"></div><div class="content"><h3 class="work-title">Shokubutsu</h3><p class="work-meta">TVC, KEY VISUAL, AND BODY-CARE CAMPAIGN ROLLOUT.</p></div></article>',
              '<a class="card shoku overlay no-save" href="shokubutsu.html" aria-label="Open Shokubutsu project detail"><span class="tag">TVC KV Campaign</span><div class="frame"><img src="assets/shokubutsu.png" alt="Shokubutsu Campaign" draggable="false"></div><div class="content"><h3 class="work-title">Shokubutsu</h3><p class="work-meta">TVC, KEY VISUAL, AND BODY-CARE CAMPAIGN ROLLOUT.</p></div></a>'
          )
          p.write_text(s, encoding='utf-8')

          # 2) Works: make Shokubutsu cards open detail page too.
          p = Path('works.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<article class="feature-card"><img src="assets/shokubutsu.png" alt="Shokubutsu"><div class="feature-content"><span class="tag">TVC / KV / Rollout</span><h3>Shokubutsu</h3><p>Body-care campaign visuals with TVC and key visual energy.</p></div></article>',
              '<a class="feature-card" href="shokubutsu.html" aria-label="Open Shokubutsu project detail"><img src="assets/shokubutsu.png" alt="Shokubutsu"><div class="feature-content"><span class="tag">TVC / KV / Rollout</span><h3>Shokubutsu</h3><p>Body-care campaign visuals with TVC and key visual energy.</p></div></a>'
          )
          s = s.replace(
              '<article class="work-item" data-category="kv"><div class="thumb"><img src="assets/shokubutsu.png" alt="Shokubutsu"></div><div class="item-copy"><b>Key Visual</b><h3>Shokubutsu</h3><p>Whip foam / vacation campaign visual series.</p></div></article>',
              '<a class="work-item" data-category="kv" href="shokubutsu.html" aria-label="Open Shokubutsu project detail"><div class="thumb"><img src="assets/shokubutsu.png" alt="Shokubutsu"></div><div class="item-copy"><b>Key Visual</b><h3>Shokubutsu</h3><p>Whip foam / vacation campaign visual series.</p></div></a>'
          )
          p.write_text(s, encoding='utf-8')

          # 3) About: remove Freelance row if still present.
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<div class="row"><b>2017 — 2018</b><div><h3>Freelance</h3><p>Motion Graphic Designer — motion graphics, online content, and animation-based design support\.</p></div></div>', '', s)
          p.write_text(s, encoding='utf-8')

          # 4) Motion JS: add selected-work depth only. No layout edits.
          p = Path('assets/site-motion.js')
          s = p.read_text(encoding='utf-8')
          insert = """const stackCards=[...document.querySelectorAll('.wall .card')];let stackRaf=null;function selectedStackMotion(){if(!stackCards.length)return;const wall=document.querySelector('.wall');if(!wall)return;if(window.matchMedia('(max-width: 767px)').matches){stackCards.forEach(card=>card.style.translate='');return;}const rect=wall.getBoundingClientRect();const progress=Math.max(0,Math.min(1,(window.innerHeight-rect.top)/(window.innerHeight+rect.height)));const speedMap={shoku:-34,ext:22,air:-18,shell:28,birdy:-24,paecal:18};stackCards.forEach(card=>{const key=[...card.classList].find(c=>speedMap[c]!==undefined);const speed=speedMap[key]||12;const y=(.5-progress)*speed;card.style.translate=`0 ${y.toFixed(2)}px`;});}function requestStackMotion(){if(stackRaf)return;stackRaf=requestAnimationFrame(()=>{stackRaf=null;selectedStackMotion();});}selectedStackMotion();window.addEventListener('scroll',requestStackMotion,{passive:true});window.addEventListener('resize',requestStackMotion);"""
          if 'selectedStackMotion' not in s:
              s = s.replace("const nav=document.querySelector('.nav');", insert + "const nav=document.querySelector('.nav');")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/patch-selected-motion-and-links.yml
      - name: Commit patch
        run: |
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add index.html works.html about.html assets/site-motion.js .github/workflows/patch-selected-motion-and-links.yml
          git commit -m "Add selected works depth motion and Shokubutsu links" || exit 0
          git push
