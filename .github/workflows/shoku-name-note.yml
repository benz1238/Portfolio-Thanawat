name: Shoku name note
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shoku-name-note.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shokubutsu.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<h1>Shoku<br><span>butsu.</span></h1>','<h1><span>Shokubutsu.</span></h1>')
          s=s.replace('width:min(720px,58%)','width:min(820px,62%)')
          s=s.replace('font:900 clamp(66px,10vw,148px)/.82 var(--head)','font:900 clamp(58px,8.6vw,122px)/.86 var(--head)')
          s=s.replace('right:44%;bottom:8%;width:255px','left:0;bottom:5%;width:min(520px,45vw)')
          s=s.replace('right:3%;bottom:3%;width:230px','left:0;bottom:-58px;width:min(520px,45vw)')
          s=s.replace('border:1px solid rgba(223,255,0,.22);background:rgba(16,16,15,.86);backdrop-filter:blur(14px);border-radius:24px;padding:18px 20px;box-shadow:0 24px 70px rgba(0,0,0,.42);font:800 11px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)','border-left:2px solid var(--acid);background:transparent;backdrop-filter:none;border-radius:0;padding:0 0 0 18px;box-shadow:none;font:800 11px/1.65 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)')
          s=s.replace('position:relative;right:auto;bottom:auto;width:100%;margin-top:14px','position:relative;left:auto;bottom:auto;width:100%;margin-top:14px')
          p.write_text(s, encoding='utf-8')
          PY
      - run: |
          rm -f .github/workflows/shoku-name-note.yml
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add shokubutsu.html .github/workflows/shoku-name-note.yml
          git commit -m "Refine Shokubutsu hero name and notes" || exit 0
          git push
